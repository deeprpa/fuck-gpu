logger:
  default:
  - writer: console
    level: debug
  - writer: file
    level: debug
    filename: ./logs/default.log
    maxsize: 10
    maxage: 15
    maxbackups: 5
    localtime: true
    compress: true

gateway:
  enable: true
  listen_addr: ":8080"

global:
  allocatable:
    gpu_memory: 16G

apps:
- name: llm-qwen3
  command:
    workdir: ./
    command: "server"
    args:
    - "--port={{index}}"
    - "--name=instance_{{index}}"
    envs:
    - key: APP_NAME
      value: sleep_{{index}}
  restart:
    max_retries: 3
    interval: 5
  replica:
    static: 1
    require:
      gpu_memory: 4G
    max_replicas: 2
    min_replicas: 1
  web_app:
    port: 8000
    path_prefix: "/qwen3"
    
- name: example-app
  command:
    workdir: ./
    command: "echo"
    args:
    - "Instance {{index}} started"
    envs: []
  restart:
    max_retries: 0
    interval: 0
  replica:
    static: 1
    require:
      gpu_memory: 0